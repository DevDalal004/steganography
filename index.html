<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steganography App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Image Steganography</h1>
    <input type="file" id="imageInput" accept="image/*" />
    <textarea id="messageInput" placeholder="Enter secret message"></textarea>
    <button onclick="encodeMessage()">Encode</button>
    <button onclick="decodeMessage()">Decode</button>
    <button id="downloadBtn" style="display:none;" onclick="downloadImage()">Download Image</button>
    <canvas id="canvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
